<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1500 1050" role="img" aria-labelledby="title desc">
  <title id="title">d00s infrastructure and traffic flow</title>
  <desc id="desc">Public traffic enters through Atlantis, Zion, or Asguard. HAProxy routes main applications to Traefik and disposable cluster applications through per-cluster listeners. Kubernetes runs on virtual machines backed by a four-node Proxmox and Ceph cluster.</desc>
  <defs>
    <style>
      .bg{fill:#f5f3ec}.zone{fill:#fff;stroke:#b8c1c0;stroke-width:2}.edge{fill:#fff4e7;stroke:#de9b57;stroke-width:2}.core{fill:#e8f6f1;stroke:#3b9a83;stroke-width:2}.infra{fill:#eaf0fa;stroke:#6688bb;stroke-width:2}.data{fill:#f0eafb;stroke:#8b6db1;stroke-width:2}.title{font:700 29px system-ui,sans-serif;fill:#071622}.label{font:700 18px system-ui,sans-serif;fill:#071622}.small{font:14px system-ui,sans-serif;fill:#52636c}.tiny{font:12px ui-monospace,monospace;fill:#52636c}.flow{fill:none;stroke:#173a4a;stroke-width:3;marker-end:url(#arrow)}.alt{fill:none;stroke:#b26d28;stroke-width:3;stroke-dasharray:8 6;marker-end:url(#arrow-orange)}.storage{fill:none;stroke:#75549b;stroke-width:3;marker-end:url(#arrow-purple)}.click{cursor:pointer}.click:hover rect{stroke-width:4}.legend{font:13px system-ui,sans-serif;fill:#52636c}
    </style>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0l10 5-10 5z" fill="#173a4a"/></marker>
    <marker id="arrow-orange" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0l10 5-10 5z" fill="#b26d28"/></marker>
    <marker id="arrow-purple" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0l10 5-10 5z" fill="#75549b"/></marker>
  </defs>
  <rect class="bg" width="1500" height="1050"/>
  <text class="title" x="55" y="54">d00s infrastructure · public routing, platforms and storage</text>
  <text class="small" x="55" y="80">Click a component to open its administrator runbook. Solid lines serve the main platform; dashed lines are disposable-cluster routing.</text>

  <rect class="zone" x="55" y="110" width="1390" height="170" rx="18"/>
  <text class="label" x="80" y="142">Public entry points</text>
  <a href="/docs/zion" class="click"><g><rect class="edge" x="90" y="165" width="340" height="82" rx="10"/><text class="label" x="115" y="198">Zion · HAProxy + DNS</text><text class="tiny" x="115" y="224">85.215.175.240 · TCP 80/443/6443</text></g></a>
  <a href="/docs/atlantis" class="click"><g><rect class="edge" x="580" y="165" width="340" height="82" rx="10"/><text class="label" x="605" y="198">Atlantis · primary edge</text><text class="tiny" x="605" y="224">77.173.17.16 · HAProxy/BIND/Loki/Vault</text></g></a>
  <a href="/docs/asguard" class="click"><g><rect class="edge" x="1070" y="165" width="340" height="82" rx="10"/><text class="label" x="1095" y="198">Asguard · HAProxy + DNS</text><text class="tiny" x="1095" y="224">107.174.69.222 · factory ingress edge</text></g></a>
  <path class="flow" d="M430 206H570"/><text class="tiny" x="462" y="193">WireGuard + PROXY v2</text>
  <path class="flow" d="M1070 206H930"/><text class="tiny" x="943" y="193">WireGuard + PROXY v2</text>

  <rect class="zone" x="55" y="310" width="1390" height="235" rx="18"/>
  <text class="label" x="80" y="342">Routing and identity services</text>
  <a href="/docs/atlantis" class="click"><g><rect class="edge" x="90" y="375" width="360" height="118" rx="10"/><text class="label" x="115" y="407">Atlantis HAProxy</text><text class="small" x="115" y="433">SNI routing · health checks · API leastconn</text><text class="tiny" x="115" y="458">*.apps.d00s.org → 192.168.61.205:443</text><text class="tiny" x="115" y="477">factory ports → profile ingress .180</text></g></a>
  <a href="/docs/identity" class="click"><g><rect class="core" x="570" y="375" width="360" height="118" rx="10"/><text class="label" x="595" y="407">Keycloak + OpenLDAP</text><text class="small" x="595" y="433">d00s realm · SSO · WebAuthn · groups</text><text class="tiny" x="595" y="458">kc.apps.d00s.org · LDAP mirror pair</text><text class="tiny" x="595" y="477">Vault-backed client and bind credentials</text></g></a>
  <a href="/docs/factory" class="click"><g><rect class="core" x="1050" y="375" width="360" height="118" rx="10"/><text class="label" x="1075" y="407">Cluster Factory</text><text class="small" x="1075" y="433">Flask portal · Kubernetes jobs · Ansible</text><text class="tiny" x="1075" y="458">1/3/5 control planes · 1–6 workers</text><text class="tiny" x="1075" y="477">TTL expiry · guarded cleanup · audit records</text></g></a>
  <path class="flow" d="M450 434H560"/><path class="alt" d="M1050 434H940"/>
  <path class="alt" d="M1230 375V286H750V365"/>

  <rect class="core" x="55" y="575" width="870" height="305" rx="18"/>
  <text class="label" x="80" y="610">Main Kubernetes cluster · 192.168.61.0/24</text>
  <a href="/docs/kubernetes" class="click"><g><rect class="zone" x="90" y="640" width="355" height="88" rx="10"/><text class="label" x="115" y="674">Kubernetes v1.37</text><text class="small" x="115" y="699">config00–02 · worker10–13 · containerd</text></g></a>
  <a href="/docs/ingress" class="click"><g><rect class="zone" x="490" y="640" width="390" height="88" rx="10"/><text class="label" x="515" y="674">Traefik + MetalLB + cert-manager</text><text class="small" x="515" y="699">Ingress 192.168.61.205 · HTTPS applications</text></g></a>
  <a href="/docs/argocd" class="click"><g><rect class="zone" x="90" y="755" width="240" height="84" rx="10"/><text class="label" x="115" y="789">Argo CD</text><text class="small" x="115" y="814">d00s GitOps sync</text></g></a>
  <a href="/docs/vault" class="click"><g><rect class="zone" x="355" y="755" width="240" height="84" rx="10"/><text class="label" x="380" y="789">Vault</text><text class="small" x="380" y="814">3-node Raft + VSO</text></g></a>
  <a href="/docs/monitoring" class="click"><g><rect class="zone" x="620" y="755" width="260" height="84" rx="10"/><text class="label" x="645" y="789">Observability</text><text class="small" x="645" y="814">Prometheus/Grafana/OTel</text></g></a>
  <path class="flow" d="M270 493V565"/><path class="flow" d="M270 565H685V630"/>

  <rect class="infra" x="955" y="575" width="490" height="305" rx="18"/>
  <a href="/docs/proxmox" class="click"><g><text class="label" x="980" y="610">Proxmox VE and Ceph</text><rect class="zone" x="990" y="640" width="190" height="82" rx="10"/><text class="label" x="1015" y="674">pve0 · pve1</text><text class="small" x="1015" y="699">Compute · MON · OSD</text><rect class="zone" x="1210" y="640" width="190" height="82" rx="10"/><text class="label" x="1235" y="674">pve2 · pve3</text><text class="small" x="1235" y="699">Compute · MON · OSD</text><rect class="data" x="990" y="755" width="410" height="84" rx="10"/><text class="label" x="1015" y="789">Ceph · 8 OSDs · 4 MONs</text><text class="small" x="1015" y="814">VM disks + Kubernetes RBD CSI volumes</text></g></a>
  <path class="storage" d="M955 760H925"/><text class="tiny" x="932" y="747" text-anchor="end">VM + CSI storage</text>

  <rect class="zone" x="55" y="910" width="1390" height="105" rx="18"/>
  <a href="/docs/storage" class="click"><g><rect class="data" x="90" y="932" width="380" height="60" rx="10"/><text class="label" x="115" y="960">Atlanta NAS · NFS + Versity S3</text><text class="tiny" x="115" y="980">192.168.31.203 · backups and shared volumes</text></g></a>
  <a href="/docs/architecture" class="click"><g><rect class="zone" x="500" y="932" width="420" height="60" rx="10"/><text class="label" x="525" y="960">Disposable clusters · dev/lab/tst/k8s</text><text class="tiny" x="525" y="980">Asguard → Atlantis profile port → Traefik .180</text></g></a>
  <a href="/docs/registry" class="click"><g><rect class="zone" x="950" y="932" width="450" height="60" rx="10"/><text class="label" x="975" y="960">Harbor + Forgejo + GitHub</text><text class="tiny" x="975" y="980">images · application Git · platform source repositories</text></g></a>
