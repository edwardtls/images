  <rect class="bg" width="1800" height="1650"/>
  <text class="heading" x="55" y="48">d00s infrastructure · logical traffic and physical foundations</text>
  <text class="small" x="55" y="73">Click a component for its administrator runbook. Each horizontal band is a trust, routing, platform, or physical layer.</text>

  <rect class="layer" x="45" y="95" width="1710" height="155" rx="18"/>
  <text class="eyebrow" x="70" y="123">LAYER 0 · INTERNET AND EXTERNAL TRUST</text>
  <path class="cloud internet" filter="url(#shadow)" d="M650 209h480c48 0 68-59 31-86-17-13-39-15-57-8-20-44-77-53-109-18-25-31-75-29-98 5-44-13-87 20-82 66-25 10-37 41-20 62 11 14 28 19 45 19z"/>
  <text class="label" x="780" y="165">Internet clients</text><text class="tiny" x="725" y="190">HTTPS · WebSocket · SSH 2200 · Kubernetes API</text>
  <a href="/docs/atlantis" class="click"><g><rect class="internet" x="80" y="145" width="410" height="72" rx="10"/><text class="label" x="105" y="174">Public DNS · d00s.org</text><text class="small" x="105" y="198">Authoritative BIND on edge hosts · recursive DNS on Atlantis</text></g></a>
  <a href="/docs/certificates" class="click"><g><rect class="internet" x="1310" y="145" width="405" height="72" rx="10"/><text class="label" x="1335" y="174">Let's Encrypt ACME</text><text class="small" x="1335" y="198">DNS-01 main cluster · HTTP-01 disposable clusters</text></g></a>

  <rect class="layer" x="45" y="280" width="1710" height="265" rx="18"/>
  <text class="eyebrow" x="70" y="309">LAYER 1 · PUBLIC PERIMETER</text>
  <path class="flow" d="M820 235V258H285V342"/><path class="flow" d="M890 235V342"/><path class="flow" d="M960 235V258H1515V342"/>
  <a href="/docs/zion" class="click"><g><rect class="edge" x="80" y="342" width="410" height="157" rx="12"/><text class="label" x="105" y="374">Zion · public edge</text><text class="tiny" x="105" y="399">85.215.175.240</text><text class="small" x="105" y="425">HAProxy · authoritative BIND · Squid</text><text class="small" x="105" y="447">CrowdSec · SSH/RDP/MCP honeypots</text><text class="tiny" x="105" y="475">80/443 → private wg-zion tunnel</text></g></a>
  <a href="/docs/atlantis" class="click"><g><rect class="edge" x="695" y="342" width="410" height="157" rx="12"/><text class="label" x="720" y="374">Atlantis · primary edge/router</text><text class="tiny" x="720" y="399">77.173.17.16 · LAN 192.168.31.254</text><text class="small" x="720" y="425">HAProxy · BIND · Loki · Squid · registry cache</text><text class="small" x="720" y="447">Vault Transit · Ansible execution · CrowdSec</text><text class="tiny" x="720" y="475">Own public entry + aggregation from Zion/Asguard</text></g></a>
  <a href="/docs/asguard" class="click"><g><rect class="edge" x="1310" y="342" width="410" height="157" rx="12"/><text class="label" x="1335" y="374">Asguard · public edge/VPN</text><text class="tiny" x="1335" y="399">107.174.69.222</text><text class="small" x="1335" y="425">HAProxy · authoritative BIND · Squid</text><text class="small" x="1335" y="447">CrowdSec · honeypots · vpnwifi egress</text><text class="tiny" x="1335" y="475">Factory SNI selection + private tunnel</text></g></a>
  <path class="flow2" d="M490 420H685"/><text class="micro" x="515" y="408">WireGuard · PROXY v2</text><path class="flow2" d="M1310 420H1115"/><text class="micro" x="1134" y="408">WireGuard · PROXY v2</text>
  <rect class="pill" x="583" y="504" width="635" height="24" rx="12"/><text class="pill-text" x="650" y="520">ALL THREE EDGES SHARE CROWDSEC DECISIONS AND FORWARD LOGS TO ATLANTIS LOKI</text>

  <rect class="layer" x="45" y="575" width="1710" height="260" rx="18"/>
  <text class="eyebrow" x="70" y="604">LAYER 2 · PRIVATE ROUTING, NAME SERVICE, IDENTITY AND CONTROL</text>
  <path class="flow" d="M900 499V558H295V632"/><path class="alt" d="M1515 499V555H1490V632"/>
  <a href="/docs/atlantis" class="click"><g><rect class="route" x="80" y="632" width="430" height="155" rx="12"/><text class="label" x="105" y="664">Atlantis HAProxy routing plane</text><text class="small" x="105" y="691">TLS SNI passthrough · PROXY v2 · health checks</text><text class="tiny" x="105" y="716">*.apps.d00s.org → Traefik 192.168.61.205:443</text><text class="tiny" x="105" y="737">profile SNI → high port → profile ingress .180</text><text class="tiny" x="105" y="758">API 6443 → control planes using leastconn</text></g></a>
  <a href="/docs/certificates" class="click"><g><rect class="route" x="540" y="632" width="330" height="155" rx="12"/><text class="label" x="565" y="664">DNS and certificates</text><text class="small" x="565" y="691">BIND RFC2136 updates</text><text class="small" x="565" y="713">Certbot on Atlantis</text><text class="small" x="565" y="735">cert-manager in each cluster</text><text class="tiny" x="565" y="758">Vault-managed TSIG credential</text></g></a>
  <a href="/docs/identity" class="click"><g><rect class="route" x="900" y="632" width="390" height="155" rx="12"/><text class="label" x="925" y="664">Keycloak + OpenLDAP</text><text class="small" x="925" y="691">d00s realm · SSO · passkeys · groups</text><text class="small" x="925" y="713">Two LDAP replicas · MetalLB LDAPS</text><text class="tiny" x="925" y="738">kc.apps.d00s.org · ldap.d00s.org</text><text class="tiny" x="925" y="758">Vault-backed client and bind credentials</text></g></a>
  <a href="/docs/factory" class="click"><g><rect class="factory" x="1320" y="632" width="400" height="155" rx="12"/><text class="label" x="1345" y="664">Cluster Factory control plane</text><text class="small" x="1345" y="691">Flask portal · Kubernetes jobs · Ansible</text><text class="small" x="1345" y="713">Proxmox API · BIND · HAProxy fragments</text><text class="tiny" x="1345" y="738">topology/storage/version/TTL policy</text><text class="tiny" x="1345" y="758">serialized create/delete + residual checks</text></g></a>
  <path class="trust" d="M705 632V560H1735V225H1510"/><text class="micro" x="1665" y="550">ACME</text>

  <rect class="cluster" x="45" y="865" width="1125" height="405" rx="18"/>
  <text class="eyebrow" x="70" y="894">LAYER 3A · MAIN KUBERNETES SERVICE PLATFORM</text>
