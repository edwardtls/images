<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1800 1650" role="img" aria-labelledby="title desc">
  <title id="title">d00s layered infrastructure and traffic flow</title>
  <desc id="desc">A layered logical and physical overview. Internet traffic enters three public edges, crosses private routing and identity services, reaches the main or disposable Kubernetes clusters, and persists on Proxmox Ceph or Atlanta storage.</desc>
  <defs>
    <style>
      .bg{fill:#f5f3ec}.layer{fill:#fff;stroke:#b8c1c0;stroke-width:2}.internet{fill:#e8f3ff;stroke:#5f89b8;stroke-width:2}.edge{fill:#fff3e5;stroke:#d9893d;stroke-width:2}.route{fill:#edf5f2;stroke:#4b927e;stroke-width:2}.cluster{fill:#e9f7f2;stroke:#329579;stroke-width:2}.factory{fill:#fff8df;stroke:#c49b2f;stroke-width:2}.infra{fill:#eaf0fa;stroke:#6688bb;stroke-width:2}.data{fill:#f1ebfa;stroke:#8867ae;stroke-width:2}.neutral{fill:#f7f7f4;stroke:#a8b0ae;stroke-width:2}.heading{font:750 30px system-ui,sans-serif;fill:#071622}.layer-title{font:750 19px system-ui,sans-serif;fill:#071622}.label{font:750 17px system-ui,sans-serif;fill:#071622}.small{font:14px system-ui,sans-serif;fill:#435760}.tiny{font:12px ui-monospace,SFMono-Regular,monospace;fill:#52636c}.micro{font:11px ui-monospace,SFMono-Regular,monospace;fill:#52636c}.eyebrow{font:700 11px ui-monospace,SFMono-Regular,monospace;fill:#287a68;letter-spacing:2px}.flow{fill:none;stroke:#173a4a;stroke-width:3;marker-end:url(#arrow)}.flow2{fill:none;stroke:#173a4a;stroke-width:2.5;marker-end:url(#arrow)}.alt{fill:none;stroke:#b66d25;stroke-width:3;stroke-dasharray:9 7;marker-end:url(#arrow-orange)}.trust{fill:none;stroke:#b78b12;stroke-width:2.5;stroke-dasharray:4 5;marker-end:url(#arrow-gold)}.storage{fill:none;stroke:#76529f;stroke-width:3;marker-end:url(#arrow-purple)}.virtual{fill:none;stroke:#557bb0;stroke-width:2.5;marker-end:url(#arrow-blue)}.click{cursor:pointer}.click:hover rect,.click:hover path.cloud{stroke-width:4}.note{font:12px system-ui,sans-serif;fill:#52636c}.legend-line{stroke-width:3}.pill{fill:#e4eae8}.pill-text{font:700 10px ui-monospace,monospace;fill:#29444f;letter-spacing:.7px}
    </style>
