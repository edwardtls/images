apiVersion: scaffolder.backstage.io/v1beta3
kind: Template
metadata:
  name: team-namespace
  title: Team namespace
  description: Provision a constrained namespace through Forgejo and Argo CD.
  tags: [kubernetes, gitops, namespace]
spec:
  owner: group:default/platform-admins
  type: infrastructure
  parameters:
    - title: Namespace details
      required: [name, owner]
      properties:
        name:
          title: Namespace name
          type: string
          pattern: '^[a-z0-9](?:[-a-z0-9]{0,61}[a-z0-9])?$'
        owner:
          title: Team or owner
          type: string
          default: platform-admins
  steps:
    - id: provision
      name: Commit namespace to GitOps
      action: factory:provision
      input:
        kind: namespace
        name: ${{ parameters.name }}
        owner: ${{ parameters.owner }}
  output:
    links:
      - title: Cluster Git repository
        url: ${{ steps.provision.output.repositoryUrl }}
      - title: Argo CD application
        url: https://argo.apps.dev.d00s.org/applications/argocd/${{ steps.provision.output.applicationName }}
